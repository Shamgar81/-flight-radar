name: Flight price check

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # lets you run it manually with a button

permissions:
  contents: write             # needed to save the price memory back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Run the flight agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_agent.py

      - name: Save price memory
        run: |
          if [ -n "$(git status --porcelain last_prices.json)" ]; then
            git config user.name "flight-radar-bot"
            git config user.email "bot@users.noreply.github.com"
            git add last_prices.json
            git commit -m "update price memory"
            git push
          else
            echo "No memory change to save."
          fi
